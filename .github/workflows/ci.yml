name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Vet, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (linux-amd64)
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/manzen-agent-linux-amd64 ./cmd/agent

      - name: Build (darwin-arm64)
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/manzen-agent-darwin-arm64 ./cmd/agent
